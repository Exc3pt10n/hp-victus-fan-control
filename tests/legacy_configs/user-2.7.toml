# Konfiguration der Victus-Lüftersteuerung
# Windows: C:\ProgramData\VictusFan\config.toml
# Nach Änderungen den Dienst neu starten (siehe README).
# Alles, was hier fehlt, nimmt den eingebauten Standardwert.

[general]
profile = "balanced"          # im Netzbetrieb
battery_profile = "quiet"     # im Akkubetrieb
interval = 2.0                # Messintervall in Sekunden
critical_temp = 92.0          # ab hier sofort volle Drehzahl
backend = "auto"
log_level = "INFO"            # DEBUG zeigt jeden Messwert im Log

[control]
smoothing_up = 0.6            # 0..1, wie schnell auf steigende Temperatur reagiert wird
smoothing_down = 0.15         # 0..1, wie träge auf fallende Temperatur reagiert wird
hysteresis = 4.0              # °C Abstand, bevor wieder heruntergeregelt wird
spin_down_delay = 20.0        # Sekunden Wartezeit vor dem Herunterregeln
ramp_up_rate = 15.0           # max. Prozentpunkte pro Sekunde nach oben
ramp_down_rate = 3.0          # max. Prozentpunkte pro Sekunde nach unten
min_running_percent = 20.0    # Anlaufdrehzahl, wenn die Lüfter laufen sollen

[windows]
cpu_sensor = "perf:\\_TZ.THRM"  # von 'victus-fan sensors' gewählt
min_level = 0  # vom Hardware-Test gesetzt
fan_mode = "default"  # vom Hardware-Test gesetzt
mode = "level"  # vom Hardware-Test gesetzt
max_level_cpu = 54  # vom Hardware-Test gesetzt
max_level_gpu = 52  # vom Hardware-Test gesetzt
keepalive = 60.0              # BIOS übernimmt nach ~120 s ohne Befehl wieder

[toggle]                      # nur für Geräte ohne stufenlose Steuerung
engage_percent = 80.0         # ab diesem Bedarf: Max-Lüfter an
release_percent = 55.0        # unter diesem Bedarf: zurück zur BIOS-Automatik

# Eigene Kurven: [Temperatur °C, Lüfter %], aufsteigend sortiert.
# Beispiel – ein besonders leises Profil für Büroarbeit:
#
# [profiles.office]
# cpu_curve = [[0, 0], [60, 0], [68, 25], [78, 50], [86, 80], [92, 100]]
# gpu_curve = [[0, 0], [58, 0], [66, 25], [75, 50], [82, 80], [88, 100]]
