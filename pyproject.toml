[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "victus-fan"
dynamic = ["version"]   # einzige Quelle: victus_fan/__init__.py
description = "Intelligente Lüftersteuerung für HP-Victus-Notebooks (Windows 11)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "Pillow>=10.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["pystray>=0.19", "Pillow>=10.1"]

[project.scripts]
victus-fan = "victus_fan.cli:main"

[tool.setuptools.dynamic]
version = {attr = "victus_fan.__version__"}

[tool.setuptools]
packages = ["victus_fan", "victus_fan.backends", "victus_fan.ui"]
