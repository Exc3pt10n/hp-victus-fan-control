# Konfiguration der Victus-Lüftersteuerung
# Ort: C:\ProgramData\VictusFan\config.toml
# Änderungen werden nach dem Speichern automatisch übernommen.
# Fehlt ein Wert, gilt der eingebaute Standard. Ist die Datei fehlerhaft,
# bleibt die bisherige Einstellung aktiv (Hinweis im Log).

[general]
profile = "balanced"          # Profil im Netzbetrieb
battery_profile = "quiet"     # Profil im Akkubetrieb
interval = 2.0                # Messintervall in Sekunden
critical_temp = 92.0          # ab hier sofort volle Drehzahl
log_level = "INFO"            # DEBUG schreibt jeden Messwert ins Log

[control]
smoothing_up = 0.6            # 0..1: wie schnell auf steigende Temperatur reagiert wird
smoothing_down = 0.15         # 0..1: wie träge auf fallende Temperatur reagiert wird
hysteresis = 4.0              # °C, die es kühler sein muss, bevor heruntergeregelt wird
spin_down_delay = 20.0        # Sekunden Wartezeit vor dem Herunterregeln
ramp_up_rate = 15.0           # max. Prozentpunkte pro Sekunde nach oben
ramp_down_rate = 3.0          # max. Prozentpunkte pro Sekunde nach unten
min_running_percent = 20.0    # Anlaufdrehzahl, sobald die Lüfter laufen sollen

[windows]
# Hardware-Test und Sensor-Test tragen die passenden Werte hier selbst ein.
mode = "level"                # level = stufenlos | toggle = nur Max an/aus
fan_mode = "default"          # BIOS-Leistungsmodus beim Start: default | cool | performance
cpu_sensor = "auto"           # auto oder eine id aus "victus-fan sensors"
min_level = 0                 # kleinste wirksame Stufe > 0
max_level_cpu = 54            # 54 = 5400 U/min
max_level_gpu = 52
keepalive = 60.0              # Drehzahl erneut senden (das BIOS übernimmt nach ~120 s ohne Befehl)
mode_keepalive = 50.0         # Leistungsmodus erneut setzen (sonst ignoriert das BIOS die Drehzahl)

[update]
enabled = true                # beim Start und alle 6 Stunden nach Updates suchen
check_only = false            # true = Update nur anzeigen, nicht installieren
repo = "Exc3pt10n/hp-victus-fan-control"
branch = ""                   # leer = Standard-Branch des Repositories

[toggle]                      # nur für mode = "toggle"
engage_percent = 80.0         # ab diesem Bedarf: Max-Lüfter an
release_percent = 55.0        # unter diesem Bedarf: zurück zur BIOS-Automatik
min_on_time = 60.0            # Max bleibt mindestens so viele Sekunden an

# Eigene Profile: [Temperatur °C, Lüfter %], aufsteigend sortiert.
# Sie erscheinen automatisch im Fenster und im Tray-Menü.
#
# [profiles.office]
# cpu_curve = [[0, 20], [60, 20], [70, 30], [80, 55], [88, 80], [92, 100]]
# gpu_curve = [[0, 20], [57, 20], [67, 30], [76, 55], [84, 80], [88, 100]]
